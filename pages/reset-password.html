<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | AsolStore</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/features.css">
    <style>
        .rp-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
        }

        .rp-card {
            background: #fff;
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-sm);
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .rp-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            text-decoration: none;
        }

        .rp-logo img { width: 36px; height: 36px; }

        .rp-logo span {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            color: var(--red);
        }

        .rp-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin: 0 0 6px;
        }

        .rp-sub {
            font-size: 14px;
            color: var(--muted);
            margin: 0 0 28px;
        }

        .rp-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            margin-bottom: 14px;
        }

        .rp-field label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .rp-field input {
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: border-color .2s;
        }

        .rp-field input:focus { border-color: var(--red); }

        .rp-btn {
            width: 100%;
            padding: 13px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: var(--r);
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            margin-top: 8px;
            transition: background .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .rp-btn:hover { background: var(--red-dark); }
        .rp-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .rp-msg {
            margin-top: 16px;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: var(--r);
            display: none;
        }

        .rp-msg.error { background: #fff0f2; color: var(--red); display: block; }
        .rp-msg.success { background: #f0fdf4; color: #16a34a; display: block; }

        .rp-back {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
        }

        .rp-back:hover { color: var(--red); }
    </style>
</head>

<body>
    <div class="rp-wrap">
        <div class="rp-card">
            <a href="../index.html" class="rp-logo">
                <img src="../assets/logo.svg" alt="AsolStore">
                <span>AsolStore</span>
            </a>

            <!-- Estado: formulario de nueva contraseña -->
            <div id="rpForm">
                <h1 class="rp-title">Nueva contraseña</h1>
                <p class="rp-sub">Elige una contraseña segura para tu cuenta.</p>

                <div class="rp-field">
                    <label for="rpPass">Nueva contraseña</label>
                    <input type="password" id="rpPass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                </div>
                <div class="rp-field">
                    <label for="rpPassConfirm">Confirmar contraseña</label>
                    <input type="password" id="rpPassConfirm" placeholder="Repite la contraseña" autocomplete="new-password">
                </div>

                <div class="rp-msg" id="rpMsg"></div>

                <button class="rp-btn" id="rpBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    Guardar contraseña
                </button>

                <a href="../index.html" class="rp-back">← Volver al inicio</a>
            </div>

            <!-- Estado: éxito -->
            <div id="rpSuccess" style="display:none;">
                <div style="margin-bottom:16px;">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                </div>
                <h1 class="rp-title">¡Contraseña actualizada!</h1>
                <p class="rp-sub">Ya puedes iniciar sesión con tu nueva contraseña.</p>
                <a href="../index.html" class="rp-btn" style="text-decoration:none;margin-top:8px;">Ir al inicio</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://lbqzxnxmqpzqpqzqpqzq.supabase.co';
        const SUPABASE_KEY = 'placeholder';

        // Intenta obtener credenciales desde config global si existe
        const url = window.ASOL_CONFIG?.supabaseUrl || SUPABASE_URL;
        const key = window.ASOL_CONFIG?.supabaseKey || SUPABASE_KEY;
        const supabase = createClient(url, key);

        const btn     = document.getElementById('rpBtn');
        const msgEl   = document.getElementById('rpMsg');
        const passEl  = document.getElementById('rpPass');
        const confEl  = document.getElementById('rpPassConfirm');

        function showMsg(text, type) {
            msgEl.textContent = text;
            msgEl.className   = 'rp-msg ' + type;
        }

        btn.addEventListener('click', async () => {
            const pass  = passEl.value.trim();
            const conf  = confEl.value.trim();

            if (pass.length < 6) { showMsg('La contraseña debe tener al menos 6 caracteres.', 'error'); return; }
            if (pass !== conf)   { showMsg('Las contraseñas no coinciden.', 'error'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span> Guardando...';

            const { error } = await supabase.auth.updateUser({ password: pass });

            if (error) {
                showMsg('Error: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Guardar contraseña';
            } else {
                document.getElementById('rpForm').style.display    = 'none';
                document.getElementById('rpSuccess').style.display = 'block';
            }
        });
    </script>
</body>

</html>
